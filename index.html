<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>Synology Web Station 測試</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b13;
      --panel: rgba(19, 29, 48, 0.82);
      --line: rgba(255, 255, 255, 0.1);
      --text: #f6f8fc;
      --muted: #aab4c5;
      --accent: #66e3b4;
      --accent-strong: #2bc98d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
               max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(43, 201, 141, 0.18), transparent 34rem),
        radial-gradient(circle at 90% 90%, rgba(69, 125, 255, 0.18), transparent 32rem),
        var(--bg);
      color: var(--text);
    }

    main {
      width: min(100%, 620px);
      padding: clamp(28px, 7vw, 52px);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.36);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 7px rgba(102, 227, 180, 0.12);
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 8vw, 4rem);
      line-height: 1.05;
      letter-spacing: -0.045em;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.75;
    }

    .details {
      display: grid;
      gap: 12px;
      margin: 30px 0;
      padding: 18px 0;
      border-block: 1px solid var(--line);
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }

    .row span:last-child {
      color: var(--text);
      text-align: right;
      overflow-wrap: anywhere;
    }

    button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 16px;
      padding: 14px 20px;
      font: inherit;
      font-weight: 800;
      color: #03140e;
      background: var(--accent);
      cursor: pointer;
      transition: transform 150ms ease, background 150ms ease;
    }

    button:hover { background: var(--accent-strong); }
    button:active { transform: scale(0.985); }
    button:focus-visible { outline: 3px solid white; outline-offset: 4px; }

    #result {
      min-height: 1.5em;
      margin-top: 16px;
      text-align: center;
      color: var(--accent);
      font-weight: 700;
    }

    @media (max-width: 480px) {
      main { border-radius: 22px; }
      .row { display: grid; gap: 3px; }
      .row span:last-child { text-align: left; }
    }
  </style>
</head>
<body>
  <main>
    <div class="status"><span class="dot" aria-hidden="true"></span>連線成功</div>
    <h1>Web Station<br>已經上線</h1>
    <p>如果你能看到這個畫面，代表裝置已成功連上 Synology NAS 上的靜態網站。</p>

    <div class="details" aria-label="連線資訊">
      <div class="row"><span>網站位置</span><span id="host">—</span></div>
      <div class="row"><span>目前裝置</span><span id="device">—</span></div>
    </div>

    <button id="test" type="button">測試頁面功能</button>
    <div id="result" role="status" aria-live="polite"></div>
  </main>

  <script>
    const isTouchDevice = navigator.maxTouchPoints > 0;
    document.querySelector('#host').textContent = location.host || '本機檔案';
    document.querySelector('#device').textContent = isTouchDevice ? '觸控裝置' : '電腦';

    document.querySelector('#test').addEventListener('click', () => {
      const time = new Intl.DateTimeFormat('zh-TW', {
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      }).format(new Date());
      document.querySelector('#result').textContent = `功能正常 · ${time}`;
    });
  </script>
</body>
</html>
